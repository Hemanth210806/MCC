version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mcc_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mcc_db
      MYSQL_USER: mcc_user
      MYSQL_PASSWORD: mcc_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mcc_backend
    environment:
      DATABASE_URL: mysql+pymysql://mcc_user:mcc_pass@db:3306/mcc_db
      SECRET_KEY: mcc_production_secret_key
      JWT_SECRET_KEY: mcc_jwt_token_secret_key
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mcc_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
